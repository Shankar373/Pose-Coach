name: Pose Coach CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck-free build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install dependencies
        run: npm install
      - name: Run deterministic pose-engine tests
        run: npm test
      - name: Build production bundle
        run: npm run build
